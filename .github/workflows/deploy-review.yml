name: Deploy Public Review Mirror to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Export Review Static HTML
        run: python3 scripts/export_review.py

      - name: Setup Headless Chrome for Screenshots
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Start Next.js Server & Capture Screenshots
        run: |
          npx next start -p 3001 &
          SERVER_PID=$!
          sleep 4
          python3 scripts/capture_screenshots.py || true
          kill $SERVER_PID || true

      - name: Synchronize Export Package
        run: python3 scripts/export_review.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './review-export'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
